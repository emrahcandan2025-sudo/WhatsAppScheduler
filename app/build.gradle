plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.whatsappscheduler'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.whatsappscheduler"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // İmzalama bilgileri hiçbir zaman doğrudan koda yazılmaz; ya ortam
    // değişkenlerinden (GitHub Actions secrets) ya da yerelde
    // keystore.properties dosyasından (bu dosya .gitignore'da, repo'ya
    // asla yüklenmez) okunur.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def storeFilePath = keystoreProps.getProperty("storeFile") ?: System.getenv("KEYSTORE_FILE")
    def storePasswordValue = keystoreProps.getProperty("storePassword") ?: System.getenv("KEYSTORE_STORE_PASSWORD")
    def keyAliasValue = keystoreProps.getProperty("keyAlias") ?: System.getenv("KEYSTORE_KEY_ALIAS")
    def keyPasswordValue = keystoreProps.getProperty("keyPassword") ?: System.getenv("KEYSTORE_KEY_PASSWORD")

    signingConfigs {
        release {
            if (storeFilePath != null) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storeFilePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.0'
}
